# 发布流水线：推送 v* 标签（或手动触发）时构建 fat jar 并发布到 GitHub Release。
#
# 产物：
#   superagent-java.jar          可直接 java -jar 运行的可执行 JAR
#   superagent-java.jar.sha256   校验和（sha256sum -c 可直接使用）
#
# 供应链建议：企业环境可把 actions/* 的版本号替换为 commit SHA 固定，
# 流程与校验方法见 docs/ci.md。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（形如 v0.1.0），手动触发时必填'
        required: false
        type: string

# 创建 Release 需要写权限；其余权限一律不给。
permissions:
  contents: write

# 同一标签的发布会串行执行，避免两个 run 同时创建同名 Release。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码（含历史，便于生成发布说明）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 17（temurin）并启用 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 标签必须与 pom.xml 版本一致，避免 v0.2.0 标签里装着 0.1.0 的 jar。
      # 手动触发（workflow_dispatch）时 github.ref 不是标签，跳过该校验。
      - name: 校验标签与项目版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout | tr -d '[:space:]')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 pom.xml 版本 v${version} 不一致，拒绝发布" >&2
            exit 1
          fi

      # 测试在 ci.yml 门禁中执行；发布只做确定性打包，避免发布任务依赖模型/网络测试。
      - name: 构建可执行 JAR
        run: mvn -B -ntp -DskipTests package

      - name: 生成 SHA-256 校验和
        run: |
          set -euo pipefail
          test -f target/superagent-java.jar
          ( cd target && sha256sum superagent-java.jar > superagent-java.jar.sha256 )
          cat target/superagent-java.jar.sha256

      # 同时留一份 workflow artifact，Release 上传失败时仍有可下载产物。
      - name: 上传构建产物（workflow artifact）
        uses: actions/upload-artifact@v4
        with:
          name: superagent-java-${{ github.ref_name }}
          path: |
            target/superagent-java.jar
            target/superagent-java.jar.sha256
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Super-agent Java ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            target/superagent-java.jar
            target/superagent-java.jar.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
