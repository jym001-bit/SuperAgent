# Super-agent Java 持续集成门禁。
#
# 只跑 ubuntu-latest：本项目测试会创建临时 Git 仓库、启动本地 HTTP 服务，
# 并用子 JVM 做崩溃恢复；这些用例依赖 Linux 的 git 与进程语义（见 docs/ci.md）。
# 仓库固定为离线测试：不调用真实模型、不启动 Docker、不访问外网。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的新提交取消上一轮仍在跑的 CI，避免排队和重复占用 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只需要读仓库内容；issues: write 仅用于下面的「失败时自动留证」。
# 之所以要写 issue：Actions 日志接口需要身份，未登录环境下无法读取失败原因；
# 把日志尾部写进公开 issue，任何有仓库链接的人都能自查，也不用额外维护日志查询工具。
permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # 25 分钟足够双版本矩阵各跑一次全量测试；超时会暴露挂死的子进程或网络等待。
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 编译目标是 release 17，同时在最新 LTS 21 上验证向上升级路径。
        java: [17, 21]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ matrix.java }}（temurin）并启用 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # 测试会 git init/git commit 临时仓库，没有全局身份会直接失败。
      # init.defaultBranch=main 让临时仓库的默认分支可预期（避免 master/main 差异）。
      - name: 配置 Git（临时测试仓库提交需要）
        run: |
          set -euo pipefail
          git --version
          git config --global user.name "superagent-ci"
          git config --global user.email "superagent-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      # verify 覆盖 compile + test + shade package，产物即 target/superagent-java.jar。
      # tee 保留完整构建日志，供失败时取证；pipefail 保证 mvn 的退出码不被管道吞掉。
      - name: 编译、运行全部离线测试并打包
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee mvn-build.log

      # 失败时把日志尾部发成公开 issue。只在 JDK 17 上发一次：双版本矩阵通常同因失败，
      # 各发一条只会把 issue 列表刷满；若只有 JDK 21 挂，仍需人工到 Actions 页面看日志。
      - name: 失败时把构建日志尾部发成 issue
        if: failure() && matrix.java == 17
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f mvn-build.log ]; then echo "没有构建日志，跳过"; exit 0; fi
          {
            echo "CI 在 JDK ${GITHUB_REF_NAME} 提交 ${GITHUB_SHA} 上失败。"
            echo
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- 触发: ${GITHUB_EVENT_NAME}"
            echo
            echo '构建日志尾部（完整日志需登录查看 Actions）：'
            echo
            echo '```'
            tail -n 150 mvn-build.log
            echo '```'
            echo
            echo '失败测试的 surefire 报告（含断言信息与 stdout）：'
            echo
            echo '```'
            for f in target/surefire-reports/*.txt; do
              [ -e "$f" ] || continue
              grep -q -E 'FAILURE|ERROR' "$f" || continue
              echo "--- $f ---"
              tail -n 60 "$f"
            done
            echo '```'
          } > ci-failure.md
          gh issue create --title "CI 失败 ${GITHUB_SHA:0:7}" --body-file ci-failure.md \
            || echo "创建 issue 失败（可能未开启 issue 或权限不足）"

      # 冒烟检查：确认 fat jar 的 Main-Class 与 --serve-local 入口真实可用，
      # 避免“测试通过但产物打不开”这类交付问题。
      - name: 打包产物冒烟检查
        run: |
          set -euo pipefail
          test -f target/superagent-java.jar
          java -jar target/superagent-java.jar --help | tee /tmp/superagent-help.txt
          grep -q -- '--serve-local' /tmp/superagent-help.txt

      - name: 备份脚本语法检查
        run: bash -n deploy/backup.sh

      # 只在失败时上传，节省存储；保留 7 天足够定位一次失败。
      - name: 上传 Surefire 报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7
